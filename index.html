<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAST MISTAKE</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}
body{
background:#050816;
overflow:hidden;
color:white;
user-select:none;
touch-action:none;
}
#game{
width:100vw;
height:100vh;
position:relative;
overflow:hidden;
background:radial-gradient(circle at top,#172554,#020617 60%);
}
.topBar{
position:absolute;
top:0;
left:0;
width:100%;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:10;
}
.card{
background:rgba(255,255,255,.08);
padding:14px 20px;
border-radius:18px;
backdrop-filter:blur(12px);
font-weight:700;
}
.center{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
width:90%;
}
.title{
font-size:clamp(48px,9vw,110px);
font-weight:900;
letter-spacing:4px;
}
.subtitle{
margin-top:10px;
color:#cbd5e1;
font-size:20px;
}
.btn{
margin-top:30px;
display:inline-block;
padding:18px 36px;
border-radius:18px;
background:white;
color:black;
font-weight:900;
font-size:22px;
cursor:pointer;
transition:.2s;
}
.btn:hover{
transform:scale(1.05);
}
#roundTitle{
font-size:50px;
font-weight:900;
margin-bottom:20px;
}
#instruction{
font-size:34px;
font-weight:800;
}
#arena{
position:absolute;
inset:0;
}
.circleBtn{
width:110px;
height:110px;
border-radius:50%;
position:absolute;
transform:translate(-50%,-50%) ;
cursor:pointer;
}
.hidden{
display:none;
}
#countdown{
font-size:140px;
font-weight:900;
animation:pulse 1s infinite;
}
@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.08)}
100%{transform:scale(1)}
}
.playerList{
position:absolute;
left:20px;
bottom:20px;
width:260px;
max-height:50vh;
overflow:auto;
background:rgba(255,255,255,.07);
padding:16px;
border-radius:18px;
}
.playerRow{
display:flex;
justify-content:space-between;
padding:8px 0;
border-bottom:1px solid rgba(255,255,255,.06);
}
.alive{
color:#22c55e;
}
.dead{
color:#ef4444;
text-decoration:line-through;
opacity:.6;
}
#eliminatedBanner{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:72px;
font-weight:900;
color:#ef4444;
display:none;
z-index:50;
animation:pop .4s ease;
}
@keyframes pop{
from{transform:translate(-50%,-50%) scale(.4);opacity:0}
to{transform:translate(-50%,-50%) scale(1);opacity:1}
}
#finalOverlay{
position:absolute;
inset:0;
background:radial-gradient(circle at center,rgba(120,0,255,.18),rgba(0,0,0,.96));
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:100;
text-align:center;
padding:20px;
backdrop-filter:blur(8px);
}
#endCard{ width:min(1100px,95vw); border-radius:32px; padding:30px; background:rgba(10,10,25,.82); border:2px solid rgba(168,85,247,.28); box-shadow:0 0 50px rgba(168,85,247,.22); position:relative; overflow:hidden; }
#endGlow{ position:absolute; inset:0; background:radial-gradient(circle,#ff003355,transparent 60%); pointer-events:none; }
#finalBig{ font-size:clamp(70px,10vw,150px); font-weight:900; letter-spacing:4px; color:white; text-shadow:0 0 30px rgba(255,255,255,.3); }
#roundLost{ font-size:40px; font-weight:900; color:#ef4444; margin-top:10px; }
#finalSub{ font-size:28px; margin-top:18px; color:#e2e8f0; }
#tipBox{ margin:20px auto; padding:18px; width:min(650px,92%); background:rgba(255,255,255,.05); border-radius:18px; font-size:22px; color:#e2e8f0; }
#bottomButtons{ margin-top:35px; display:flex; justify-content:center; flex-wrap:wrap; gap:20px; }
.endBtn{ padding:18px 34px; border-radius:20px; font-size:24px; font-weight:900; color:white; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); cursor:pointer;}
.playAgainBtn{ background:linear-gradient(135deg,#facc15,#f59e0b); color:black; box-shadow:0 10px 30px rgba(250,204,21,.35); }
.flash{ position:absolute; inset:0; background:white; opacity:0; pointer-events:none; z-index:90; }

/* Temptation Styles */
.popup{
position:absolute;
background:white;
color:black;
padding:18px;
border-radius:16px;
width:320px;
box-shadow:0 10px 50px rgba(0,0,0,.5);
animation:popupAnim .3s ease;
z-index: 100;
}
.popup button{
margin-top:15px;
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-weight:700;
cursor:pointer;
}
@keyframes popupAnim{
from{transform:scale(.5);opacity:0}
to{transform:scale(1);opacity:1}
}
.shake{
animation:shakeAnim .15s infinite;
}
@keyframes shakeAnim{
0%{transform:translate(3px,0)}
25%{transform:translate(-3px,0)}
50%{transform:translate(0,3px)}
75%{transform:translate(0,-3px)}
100%{transform:translate(3px,0)}
}
.glitch{
animation:glitchAnim .08s infinite;
}
@keyframes glitchAnim{
0%{filter:hue-rotate(0deg)}
100%{filter:hue-rotate(90deg)}
}
.fakeNotif{
position:absolute;
top:20px;
left:50%;
transform:translateX(-50%);
background:#111827;
padding:18px 25px;
border-radius:18px;
width:380px;
max-width:90vw;
border:1px solid rgba(255,255,255,.1);
animation:slideDown .4s ease;
z-index: 100;
}
@keyframes slideDown{
from{transform:translate(-50%,-120px)}
to{transform:translate(-50%,0)}
}
.fakeButton{
position:absolute;
padding:20px 35px;
background:#ef4444;
border-radius:20px;
font-weight:800;
animation:pulseBtn 1s infinite;
z-index: 100;
cursor:pointer;
}
@keyframes pulseBtn{
0%{transform:scale(1)}
50%{transform:scale(1.1)}
100%{transform:scale(1)}
}
.crack{
position:absolute;
inset:0;
background:url('https://i.imgur.com/eM3g1QX.png') center/cover;
opacity:.35;
pointer-events:none;
z-index: 100;
}
</style>
</head>
<body>
<div id="game">
<div class="topBar">
<div class="card" id="rank">Rank: Bronze</div>
<div class="card" id="aliveCount">20 Alive</div>
<div class="card" id="wins">Wins: 0</div>
</div>
<div id="arena"></div>
<div class="flash" id="flash"></div>
<div class="center" id="menu">
<div class="title">LAST MISTAKE</div>
<div class="subtitle">One mistake and you're eliminated.</div>
<div class="btn" onclick="startMatch()">PLAY MATCH</div>
</div>
<div class="center hidden" id="gameUI">
<div id="countdown"></div>
<div id="roundTitle"></div>
<div id="instruction"></div>
</div>
<div class="playerList" id="playerList"></div>
<div id="eliminatedBanner">ELIMINATED</div>
<div id="finalOverlay">
<div id="endCard">
<div id="endGlow"></div>
<div id="finalBig">ELIMINATED</div>
<div id="roundLost">ROUND 2</div>
<div id="finalSub">You survived until Round 3.</div>
<div id="tipBox">💡 TIP: Stay calm and read every instruction carefully!</div>
<div id="bottomButtons">
<div class="endBtn" onclick="goHome()">🏠 HOME</div>
<div class="endBtn playAgainBtn" onclick="restartGame()">🔄 RESTART</div>
</div>
</div>
</div>
</div>

<script>
const arena = document.getElementById('arena');
const menu = document.getElementById('menu');
const gameUI = document.getElementById('gameUI');
const countdownEl = document.getElementById('countdown');
const roundTitle = document.getElementById('roundTitle');
const instruction = document.getElementById('instruction');
const playerList = document.getElementById('playerList');
const aliveCount = document.getElementById('aliveCount');
const eliminatedBanner = document.getElementById('eliminatedBanner');
const finalOverlay = document.getElementById('finalOverlay');
const winsEl = document.getElementById('wins');
const rankEl = document.getElementById('rank');
const flash = document.getElementById('flash');

let players=[];
let alivePlayers=[];
let playerAlive=true;
let round=0;
let wins=Number(localStorage.getItem('lm_wins')||0);
let currentMiniGame='';
let acceptingInput=false;
let freezeTouched=false;
let expectedSequence=[];
let playerSequence=[];
let tapCorrect=false;
let roundTimer;
let roundTimeLeft=0;
let lastMiniGame='';
let trapIndex = 0; // Tracks which single temptation to execute next

winsEl.innerHTML='Wins: '+wins;

const names=[
'ShadowX','RapidFox','Nova','Ghost','Blaze','NinjaKid','Storm','Hyper','Void','Alpha','Echo','KillerBee','Pixel','Lime','Toxic','Drift','Ace','Reactor','Venom','Dash'
];

function startMatch(){
menu.classList.add('hidden');
gameUI.classList.remove('hidden');
setupPlayers();
nextRound();
}

function setupPlayers(){
players=[];
playerAlive=true;
round=0;

players.push({
name:'YOU',
alive:true,
isPlayer:true,
reaction:0.9,
memory:0.9,
panic:0.05
});

for(let i=0;i<19;i++){
players.push({
name:names[i],
alive:true,
isPlayer:false,
reaction:Math.random(),
memory:Math.random(),
panic:Math.random()*0.35
});
}

updatePlayerList();
}

function updatePlayerList(){
playerList.innerHTML='';
alivePlayers = players.filter(p=>p.alive);
aliveCount.innerHTML = alivePlayers.length + ' Alive';

players.forEach(p=>{
const row=document.createElement('div');
row.className='playerRow';
row.innerHTML=`
<span class="${p.alive?'alive':'dead'}">${p.name}</span>
<span>${p.alive?'🟢':'💀'}</span>
`;
playerList.appendChild(row);
});
}

function nextRound(){
clearArena();
round++;

if(!playerAlive){
loseGame();
return;
}

if(alivePlayers.length<=1){
winGame();
return;
}

// REMOVED 'safeTile' from the rotation array entirely
const games=['tapColor','freeze','memory','chaosRound','followDot'];
let selected = games[Math.floor(Math.random()*games.length)];
while(selected===lastMiniGame){
selected = games[Math.floor(Math.random()*games.length)];
}
lastMiniGame = selected;

setTimeout(()=>{
window[selected]();
},1200);
}

function countdown(num,callback){
countdownEl.innerHTML=num;
let n=num;
const interval=setInterval(()=>{
n--;
if(n<=0){
clearInterval(interval);
countdownEl.innerHTML='GO';
setTimeout(()=>{
countdownEl.innerHTML='';
callback();
},500);
}else{
countdownEl.innerHTML=n;
}
},1000);
}

function startRoundTimer(seconds){
clearInterval(roundTimer);
roundTimeLeft = seconds;
const old=document.getElementById('liveTimer');
if(old) old.remove();
const timerBox=document.createElement('div');
timerBox.id='liveTimer';
timerBox.style.position='absolute';
timerBox.style.top='120px';
timerBox.style.left='50%';
timerBox.style.transform='translateX(-50%)';
timerBox.style.padding='16px 28px';
timerBox.style.borderRadius='20px';
timerBox.style.background='rgba(0,0,0,.6)';
timerBox.style.fontSize='40px';
timerBox.style.fontWeight='900';
timerBox.style.zIndex='80';
timerBox.innerHTML='⏱ '+seconds.toFixed(1)+'s';
game.appendChild(timerBox);
roundTimer=setInterval(()=>{
roundTimeLeft-=0.1;
if(roundTimeLeft<=0){
clearInterval(roundTimer);
roundTimeLeft=0;
}
const t=document.getElementById('liveTimer');
if(t) t.innerHTML='⏱ '+roundTimeLeft.toFixed(1)+'s';
},100);
}

function touchFeedback(x,y){
const fx=document.createElement('div');
fx.style.position='absolute';
fx.style.left=x+'px';
fx.style.top=y+'px';
fx.style.width='120px';
fx.style.height='120px';
fx.style.borderRadius='50%';
fx.style.transform='translate(-50%,-50%)';
fx.style.background='radial-gradient(circle,rgba(255,255,255,.9),transparent 70%)';
fx.style.pointerEvents='none';
fx.style.zIndex='999';
fx.style.animation='tapAnim .4s ease-out forwards';
game.appendChild(fx);
if(navigator.vibrate) navigator.vibrate(40);
setTimeout(()=>fx.remove(),400);
}

const tapStyle=document.createElement('style');
tapStyle.innerHTML=`@keyframes tapAnim{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(2)}}`;
document.head.appendChild(tapStyle);

function tapColor(){
currentMiniGame='tapColor';
tapCorrect=false;
roundTitle.innerHTML='ROUND '+round;

const colors=['red','blue','green','yellow'];
const target=colors[Math.floor(Math.random()*colors.length)];

instruction.innerHTML='TAP '+target.toUpperCase();

countdown(3,()=>{
acceptingInput=true;
startRoundTimer(4);

colors.forEach(color=>{
const btn=document.createElement('div');
btn.className='circleBtn';
btn.style.background=color;
btn.style.left=(20+Math.random()*60)+'vw';
btn.style.top=(25+Math.random()*55)+'vh';
btn.dataset.color=color;

btn.onclick=()=>{
if(!acceptingInput) return;
if(color===target){
tapCorrect=true;
flashEffect();
acceptingInput=false;
}else{
eliminatePlayer();
acceptingInput=false;
}
};
arena.appendChild(btn);
});

simulateBots('tapColor',target);

setTimeout(()=>{
acceptingInput=false;
if(!tapCorrect && playerAlive) eliminatePlayer();
resolveRound();
},3500);
});
}

/* UPGRADED DON'T TOUCH: Lasts 7s, runs temptation ideas sequentially per round */
function freeze(){
currentMiniGame='freeze';
freezeTouched=false;
roundTitle.innerHTML='ROUND '+round;
instruction.innerHTML='DON\'T TOUCH';

countdown(3,()=>{
acceptingInput=true;
startRoundTimer(7); // Increased to 7 seconds
simulateBots('freeze');

// Spawn only one specific trap idea based on global index tracking
setTimeout(()=>{
  if(acceptingInput) runSingleTrap(trapIndex);
  trapIndex = (trapIndex + 1) % 10; // Increment and loop back cleanly once all 10 finished
}, 1500);

setTimeout(()=>{
acceptingInput=false;
// Clean up any remaining visual traps
document.querySelectorAll('.popup,.fakeNotif,.fakeButton,.crack').forEach(e=>e.remove());
document.getElementById('game').classList.remove('shake','glitch');

if(freezeTouched && playerAlive) eliminatePlayer();
resolveRound();
},7000);
});
}

function runSingleTrap(index){
  if(!acceptingInput) return;
  
  switch(index) {
    case 0: // Fake Notification
      const notif1 = document.createElement('div');
      notif1.className='fakeNotif';
      notif1.innerHTML='<b>MESSAGE</b><br>Your friend challenged you. Tap to open.';
      arena.appendChild(notif1);
      break;
    case 1: // Fake Popup
      const popup1 = document.createElement('div');
      popup1.className='popup';
      popup1.style.left=Math.random()*60+'vw';
      popup1.style.top=Math.random()*50+'vh';
      popup1.innerHTML=`<h2>System Alert</h2><p>Your storage is almost full.</p><button>Fix Now</button>`;
      arena.appendChild(popup1);
      break;
    case 2: // Fake Button Trap
      const btn = document.createElement('div');
      btn.className='fakeButton';
      btn.innerHTML='FREE MONEY';
      btn.style.left=Math.random()*60+'vw';
      btn.style.top=Math.random()*60+'vh';
      arena.appendChild(btn);
      break;
    case 3: // Screen Shake
      document.getElementById('game').classList.add('shake');
      break;
    case 4: // Fake Reward Popup
      const popup2 = document.createElement('div');
      popup2.className='popup';
      popup2.style.left='50%';
      popup2.style.top='50%';
      popup2.style.transform='translate(-50%,-50%)';
      popup2.innerHTML=`<h2>🎉 YOU WON</h2><p>Tap to claim your reward.</p><button>CLAIM</button>`;
      arena.appendChild(popup2);
      break;
    case 5: // Flash Trap
      flash.style.transition='none';
      flash.style.opacity='1';
      setTimeout(()=>{
        flash.style.transition='1s';
        flash.style.opacity='0';
      },100);
      break;
    case 6: // Crack Overlay
      const crack = document.createElement('div');
      crack.className='crack';
      arena.appendChild(crack);
      break;
    case 7: // Glitch Visual
      document.getElementById('game').classList.add('glitch');
      break;
    case 8: // Fake Battery Alert
      const notif2 = document.createElement('div');
      notif2.className='fakeNotif';
      notif2.innerHTML='<b>⚠ Battery Critical</b><br>1% remaining. Plug charger now.';
      arena.appendChild(notif2);
      break;
    case 9: // Fake Call Alert
      const notif3 = document.createElement('div');
      notif3.className='fakeNotif';
      notif3.innerHTML='<b>📞 Incoming Call</b><br>Mom is calling...';
      arena.appendChild(notif3);
      break;
  }
}

function memory(){
currentMiniGame='memory';
expectedSequence=[];
playerSequence=[];
roundTitle.innerHTML='ROUND '+round;
instruction.innerHTML='MEMORIZE THE SEQUENCE';

const colors=['red','blue','green'];

countdown(3,()=>{
let i=0;
const show=setInterval(()=>{
const color=colors[Math.floor(Math.random()*colors.length)];
expectedSequence.push(color);
flashColor(color);
i++;

if(i>=3){
clearInterval(show);
setTimeout(()=>{
showMemoryButtons(colors);
},1200);
}
},800);
});
}

function showMemoryButtons(colors){
instruction.innerHTML='REPEAT THE SEQUENCE';
acceptingInput=true;
startRoundTimer(5);

colors.forEach(color=>{
const btn=document.createElement('div');
btn.className='circleBtn';
btn.style.background=color;
btn.style.left=(25+Math.random()*50)+'vw';
btn.style.top=(35+Math.random()*40)+'vh';

btn.onclick=()=>{
if(!acceptingInput) return;
playerSequence.push(color);
const currentIndex=playerSequence.length-1;

if(playerSequence[currentIndex]!==expectedSequence[currentIndex]){
acceptingInput=false;
eliminatePlayer();
resolveRound();
return;
}

if(playerSequence.length===expectedSequence.length){
acceptingInput=false;
flashEffect();
resolveRound();
}
};
arena.appendChild(btn);
});

simulateBots('memory');

setTimeout(()=>{
if(acceptingInput){
acceptingInput=false;
eliminatePlayer();
resolveRound();
}
},5000);
}

function flashColor(color){
flash.style.background=color;
flash.style.opacity='.8';
setTimeout(()=>{
flash.style.opacity='0';
},300);
}

function chaosRound(){
currentMiniGame='chaosRound';
roundTitle.innerHTML='ROUND '+round;

const avoidBlue = Math.random() > 0.5;
instruction.innerHTML = avoidBlue ? "DON'T PRESS BLUE" : "PRESS BLUE TO SURVIVE";

const tiny=document.createElement('div');
tiny.style.marginTop='20px';
tiny.style.fontSize='16px';
tiny.style.opacity='.8';
tiny.innerHTML = avoidBlue ? '(pressing blue eliminates you)' : '(everyone else loses)';
instruction.appendChild(tiny);

countdown(3,()=>{
acceptingInput=true;
startRoundTimer(4);

let playerActed = false;

['red','blue','green'].forEach((color,i)=>{
const btn=document.createElement('div');
btn.className='circleBtn';
btn.style.background=color;
btn.style.left=(25+i*25)+'vw';
btn.style.top='50vh';

btn.onclick=()=>{
if(!acceptingInput) return;
playerActed = true;

const correct = avoidBlue ? (color !== 'blue') : (color === 'blue');

if(correct){
flashEffect();
acceptingInput=false;
resolveRound();
}else{
eliminatePlayer();
acceptingInput=false;
resolveRound();
}
};
arena.appendChild(btn);
});

simulateBots('chaos');

setTimeout(() => {
if(acceptingInput){
acceptingInput = false;
if(!avoidBlue && !playerActed) {
eliminatePlayer();
}
resolveRound();
}
}, 4000);
});
}

function followDot(){
currentMiniGame='followDot';
roundTitle.innerHTML='ROUND '+round;
instruction.innerHTML='TAP THE MOVING DOT';

countdown(3,()=>{
acceptingInput=true;
startRoundTimer(6);

const dot=document.createElement('div');
dot.style.position='absolute';
dot.style.width='90px';
dot.style.height='90px';
dot.style.borderRadius='50%';
dot.style.background='linear-gradient(135deg,#60a5fa,#a855f7)';
dot.style.boxShadow='0 0 40px #60a5fa';
dot.style.left='50vw';
dot.style.top='50vh';
dot.style.cursor='pointer';

let x=50;
let y=50;

const move=setInterval(()=>{
x=10+Math.random()*80;
y=20+Math.random()*60;
dot.style.left=x+'vw';
dot.style.top=y+'vh';
},700);

dot.onclick=()=>{
if(!acceptingInput) return;
clearInterval(move);
flashEffect();
acceptingInput=false;
resolveRound();
};
arena.appendChild(dot);

simulateBots('followDot');

setTimeout(()=>{
if(acceptingInput){
clearInterval(move);
acceptingInput=false;
eliminatePlayer();
resolveRound();
}
},6000);
});
}

function simulateBots(type,target){
players.forEach(bot=>{
if(bot.isPlayer || !bot.alive) return;

let failChance = bot.panic;
if(type==='tapColor' && bot.reaction<0.35) failChance+=0.3;
if(type==='freeze' && bot.panic>0.2) failChance+=0.25; // slightly modified balance to fit 7s window
if(type==='memory' && bot.memory<0.4) failChance+=0.4;

if(Math.random()<failChance){
setTimeout(()=>{
bot.alive=false;
updatePlayerList();
},500+Math.random()*2000);
}
});
}

function resolveRound(){
const t=document.getElementById('liveTimer');
if(t) t.remove();
clearInterval(roundTimer);

setTimeout(()=>{
updatePlayerList();
clearArena();
tapCorrect=false;
nextRound();
},2000);
}

function eliminatePlayer() {
if(!playerAlive) return;

playerAlive=false;
players[0].alive=false;
updatePlayerList();

eliminatedBanner.style.display='block';
setTimeout(()=>{
eliminatedBanner.style.display='none';
},1500);
}

function winGame(){
wins++;
localStorage.setItem('lm_wins',wins);
winsEl.innerHTML='Wins: '+wins;
updateRank();

document.getElementById('finalBig').innerHTML='VICTORY';
document.getElementById('roundLost').innerHTML='LAST PLAYER STANDING';
document.getElementById('finalSub').innerHTML='You survived every round and won the match.';
finalOverlay.style.display='flex';
}

function loseGame(){
updateRank();
const popup=document.createElement('div');
popup.style.position='absolute';
popup.style.inset='0';
popup.style.background='rgba(0,0,0,.92)';
popup.style.display='flex';
popup.style.alignItems='center';
popup.style.justifyContent='center';
popup.style.flexDirection='column';
popup.style.zIndex='200';
popup.innerHTML=`<div style="font-size:100px;font-weight:900;color:#ef4444">ELIMINATED</div><div style="font-size:34px;margin-top:10px">Please wait <span id='waitTimer'>4</span>s</div>`;
document.getElementById('game').appendChild(popup);
let wait=4;
const waitInterval=setInterval(()=>{
wait--;
const wt=document.getElementById('waitTimer');
if(wt) wt.innerHTML=wait;
if(wait<=0){
clearInterval(waitInterval);
popup.remove();
document.getElementById('finalBig').innerHTML='ELIMINATED';
document.getElementById('roundLost').innerHTML='ROUND '+round;
document.getElementById('finalSub').innerHTML='You survived until Round '+round+'.';
finalOverlay.style.display='flex';
}
},1000);
}

function updateRank(){
let rank='Bronze';
if(wins>=3) rank='Silver';
if(wins>=7) rank='Gold';
if(wins>=15) rank='Diamond';
if(wins>=30) rank='Elite';
if(wins>=60) rank='Last One';

rankEl.innerHTML='Rank: '+rank;
}

function clearArena(){
arena.innerHTML='';
}

function flashEffect(){
flash.style.background='white';
flash.style.opacity='.9';
setTimeout(()=>{
flash.style.opacity='0';
},150);
}

function goHome(){
finalOverlay.style.display='none';
gameUI.classList.add('hidden');
menu.classList.remove('hidden');
clearArena();
}

function restartGame(){
finalOverlay.style.display='none';
setupPlayers();
nextRound();
}

window.addEventListener('touchstart',(e)=>{
const t=e.touches[0];
touchFeedback(t.clientX,t.clientY);
if(currentMiniGame==='freeze' && acceptingInput){
freezeTouched=true;
}
},{passive:false});

window.addEventListener('mousedown',(e)=>{
if(e.target.classList.contains('endBtn') || e.target.classList.contains('btn')) return;
touchFeedback(e.clientX,e.clientY);
if(currentMiniGame==='freeze' && acceptingInput){
freezeTouched=true;
}
});

updateRank();
</script>
</body>
</html>
